# M36e — how much of the privileged trajectory does the mixer's step operator need?
#
# WHY. M36b/M36c: trm_mixer + T-curriculum (T ~ U{1..8}) + step-aligned DS learns a transferable CA
# step (acc 0.899 / EM 0.690 at T=32 = 4×T_max), but it is told EVERY intermediate state s_1..s_T.
# Real targets never come with a trajectory, so the question for the program is how much of that
# signal is needed. One ladder, every arm the same mixer (same width, same curriculum, same seeds);
# only the supervision changes (new knob `ds_stride`: supervise s_i only when i % stride == 0, plus
# the final s_T always; stride 1 = the M36c loss exactly):
#   - mixer_stride1     every intermediate state (= M36c's trm_mixer_stepds)
#   - mixer_stride2     every 2nd state + final
#   - mixer_stride4     every 4th state + final
#   - mixer_finalonly   stride 8 with T <= 8 ⇒ ONLY the final s_T per batch, no intermediate state.
#                       Still a curriculum: across batches it sees s_T for T = 1..8, one per batch.
#   - mixer_progressive Deep Thinking progressive loss against the FINAL state only (M7 recipe:
#                       T−k detached steps, then k steps with gradient; alpha 0.5), no trajectory.
#   - ff_matched        §4a grounding.
# (The M36b `trm_mixer_finalds` arm — final target on EVERY step — already failed; it is a different
# loss from mixer_finalonly, which supervises only the last step.)
# Rule 110, w=24, distractors=0, n_train 4000, 100 epochs, 8 seeds; GPU eager.
task:
  name: iterated
  params:
    w: 24
    T: 8
    rule: 110
    distractors: 0
  n_train: 4000
  n_test: 1000
  task_seed: 42
  train_sample_seed: 1
  test_sample_seed: 2

curriculum:
  param: T
  T_min: 1
  T_max: 8

couple_n_steps_to_param: T

arms:
  - name: trm_mixer
    label: mixer_stride1
    hidden_dim: 96
    latent_dim: 64
    token_hidden: 32
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
    ds_mode: step_aligned
    ds_stride: 1
  - name: trm_mixer
    label: mixer_stride2
    hidden_dim: 96
    latent_dim: 64
    token_hidden: 32
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
    ds_mode: step_aligned
    ds_stride: 2
  - name: trm_mixer
    label: mixer_stride4
    hidden_dim: 96
    latent_dim: 64
    token_hidden: 32
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
    ds_mode: step_aligned
    ds_stride: 4
  - name: trm_mixer
    label: mixer_finalonly
    hidden_dim: 96
    latent_dim: 64
    token_hidden: 32
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
    ds_mode: step_aligned
    ds_stride: 8
  - name: trm_mixer
    label: mixer_progressive
    hidden_dim: 96
    latent_dim: 64
    token_hidden: 32
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
    ds_mode: progressive_final
    progressive_alpha: 0.5
  - name: ff_matched
    label: ff_matched
    hidden_dim: 64
    latent_dim: 64
    n_steps: 8

deltas:
  - [mixer_stride1, mixer_stride2]
  - [mixer_stride1, mixer_stride4]
  - [mixer_stride1, mixer_finalonly]
  - [mixer_finalonly, mixer_progressive]
  - [mixer_finalonly, ff_matched]
  - [mixer_progressive, ff_matched]

train:
  epochs: 100
  lr: 1e-3
  weight_decay: 1e-4
  batch_size: 256
  device: cuda

extrapolation:
  T_values: [4, 8, 12, 16, 24, 32]
  R_values: [4, 8, 12, 16, 24, 32]

budget_reference: mixer_stride1
budget_tol: 0.05

seeds: [0, 1, 2, 3, 4, 5, 6, 7]
parallel_workers: 3
results_dir: results
