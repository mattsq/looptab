# M34 — synthetic scale-up (direction A): push Sudoku from M23/M33's size=6 toy grid (36 cells) to
# CLASSIC 9x9 Sudoku (81 cells, 3x3 boxes) — the canonical TRM benchmark, never run in this repo at
# real scale before. Same 7-arm M33 decomposition recipe; widths from
# scratchpad/m34/probe_budget_synth.py (identical across n_givens — geometry doesn't depend on it).
#
# n_givens=[30,26,24] chosen empirically for TRACTABLE generation time (measured: ~43/123/360
# ms/puzzle respectively; n_givens<=20 was not attempted — near-minimal-clue 9x9 puzzles are a much
# harder combinatorial digging problem and risked an unbounded generation time). Lower clue count
# plausibly means harder (most published "hard" 9x9 puzzles sit in the 22-27 clue range, and
# results here are monotonic with n_givens), but NO independent hardness measure (solve depth,
# branching factor) was computed -- treat these as three train/test instances, not a validated
# medium/hard/very-hard ladder (post-review correction; see results/log/m34.md). Not a literal
# rescaling of M33's size=6 n_givens ratios either way.
#
# n_train reduced to 4000 (vs M33 sudoku's 8000) specifically to bound total generation wall-clock
# at the hardest point (~360ms x 4500 puzzles x 5 seeds ~= 27 min for that one difficulty point);
# seeds trimmed to 5 (the CLAUDE.md §5.2 variance-band floor, not the >=8 significance floor) for
# the same reason — this is an exploratory scale-up, not a significance-targeted claim. Total
# estimated data-gen wall-clock across all 3 difficulties x 5 seeds: ~3.3 hours (data generation
# dominates; training itself is fast under compile+amp).

task:
  name: sudoku
  params:
    size: 9
  n_train: 4000
  n_test: 500
  task_seed: 42
  train_sample_seed: 1
  test_sample_seed: 2

sweep:
  param: n_givens
  values: [30, 26, 24]

arms:
  - name: trm_mixer
    label: trm_mixer
    hidden_dim: 370
    latent_dim: 370
    token_hidden: 64
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm_mixer_nomix
    label: trm_mixer_nomix
    hidden_dim: 380
    latent_dim: 380
    token_hidden: 64
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm_mixer_unsharedro
    label: trm_mixer_unsharedro
    hidden_dim: 238
    latent_dim: 238
    token_hidden: 64
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm_mixer_nomix_unsharedro
    label: trm_mixer_nomix_unsharedro
    hidden_dim: 244
    latent_dim: 244
    token_hidden: 64
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm_mixer_nomix_distinctw
    label: trm_mixer_nomix_distinctw
    hidden_dim: 40
    latent_dim: 40
    token_hidden: 64
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm
    label: trm_flat
    hidden_dim: 128
    latent_dim: 128
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: ff_matched
    label: ff_matched
    hidden_dim: 128
    latent_dim: 128
    n_steps: 8

deltas:
  - [trm_mixer, trm_mixer_nomix]
  - [trm_mixer_nomix, ff_matched]
  - [trm_mixer_nomix, trm_mixer_nomix_unsharedro]
  - [trm_mixer, trm_mixer_unsharedro]
  - [trm_mixer_unsharedro, trm_mixer_nomix_unsharedro]
  - [trm_mixer_nomix, trm_mixer_nomix_distinctw]
  - [trm_mixer_nomix_unsharedro, ff_matched]
  - [trm_mixer, ff_matched]
  - [trm_flat, ff_matched]

train:
  epochs: 25
  lr: 1e-3
  weight_decay: 1e-4
  batch_size: 256
  device: cuda
  amp: true

budget_reference: trm_flat
budget_tol: 0.05

seeds: [0, 1, 2, 3, 4]
parallel_workers: 1
results_dir: results
