# M34b — Explorative Modeling (arXiv 2607.27372) on the one task in this repo with a GENUINELY
# MULTIMODAL target: `ambiguous_converge` (M34). Several CA fixed points are consistent with each
# masked input, and the mode set is ENUMERABLE from X, so XM's central claim — "the number of modes
# a model captures grows with exploration" — is measured directly instead of by proxy.
#
# Why this task and not the rest of the suite: every other generator here is a single-valued
# function of X, so best-of-K has nothing to explore and degenerates into a noisier ERM. Running XM
# there first would repeat the M18 mistake (crediting a mechanism for what is just more compute).
#
# THE comparisons (all single-knob; every arm carries the SAME latent channel so "has a stochastic
# latent" is held fixed and only K varies):
#   Δ(trm_mixer_xm8 − trm_mixer_xm1)  — exploration on the repo's default recurrent arm.
#   Δ(ff_xm8 − ff_xm1)                — exploration on the NON-recurrent control. XM's thesis is
#                                       that the objective can do what the refinement loop does, so
#                                       this is the crux, not a side-control.
#   Δ(ff_xm8 − trm_mixer_det)         — can an exploring feedforward net match the refinement loop?
#   Δ(trm_mixer_xm1 − trm_mixer_det)  — does merely HAVING a latent (no exploration) move anything?
#   Δ(trm_mixer_det − ff_det)         — the M24 mixer-win anchor, re-measured on this new task.
#
# METRICS. Accuracy/EM cannot separate the hypotheses here: with labels drawn uniformly from a
# row's mode set, every valid predictor — a perfect mode sampler AND a deterministic pick-one-mode
# model — scores the same expected EM, E[1/n_modes] (~0.30 at n_masked=4). The discriminating
# metrics are `mode_validity` (is the output a valid mode at all, i.e. commit vs blur — a perfect
# conditional-mean predictor is valid in only ~35% of rows, screened) and `mode_coverage` (fraction
# of a row's modes produced over 8 latent draws). `latent_sensitivity`/`distinct_predictions` are
# the collapse check: if the model learns to ignore ε they go to 0/1 and the whole thing degenerated.
#
# BUDGET: all arms matched to `trm_flat_det` within ±5% (widths from scratchpad/m34/probe_budget.py,
# computed at in_features = w data + w noise cells). Deterministic arms carry the SAME noise channel
# at std=0, so architecture and parameter count are identical across the K axis — the Δ is
# exploration and nothing else. num_threads = repo default 1 (3-D matmul arms).
# COMPUTE: a K=8 step is 8 no-grad forwards + 1 train step ≈ 3× a K=1 step. The compute-matched
# control is the companion config m34b_ambiguous_3xep.yaml (K=1/det arms at 3× epochs) — M18's
# lesson is that an apparent mechanism gain is often just more optimization.

task:
  name: ambiguous_converge
  params:
    w: 24
    rule: 78          # the M9/M24/M33 converge anchor; screened: every row ambiguous, all
    n_masked: 4       #   completions convergent, mean 3.7 modes at n_masked=4
  n_train: 4000
  n_test: 1000
  task_seed: 42
  train_sample_seed: 1
  test_sample_seed: 2

sweep:
  param: n_masked     # the difficulty dial = log2(#completions); mean modes 1.9 / 3.7 / 6.7
  values: [2, 4, 6]

arms:
  - name: trm_mixer
    label: trm_mixer_det          # §4 default recurrent arm; latent present but std=0 ⇒ deterministic
    hidden_dim: 102
    latent_dim: 64
    token_hidden: 48
    n_steps: 8
    use_rmsnorm: true
    deep_supervision: true
    explore_noise_dim: 24         # one noise channel per cell (keeps in%out==0 for the mixer)
    explore_noise_std: 0.0
  - name: trm_mixer
    label: trm_mixer_xm1          # stochastic latent, ONE draw (the exploration control)
    hidden_dim: 102
    latent_dim: 64
    token_hidden: 48
    n_steps: 8
    use_rmsnorm: true
    deep_supervision: true
    explore_noise_dim: 24
    explore_noise_std: 1.0
    explore_k: 1
  - name: trm_mixer
    label: trm_mixer_xm8          # best-of-8 exploration — the XM arm
    hidden_dim: 102
    latent_dim: 64
    token_hidden: 48
    n_steps: 8
    use_rmsnorm: true
    deep_supervision: true
    explore_noise_dim: 24
    explore_noise_std: 1.0
    explore_k: 8
  - name: ff_matched
    label: ff_det                 # §4a param-matched joint MLP, deterministic
    hidden_dim: 65
    latent_dim: 64
    n_steps: 8
    explore_noise_dim: 24
    explore_noise_std: 0.0
  - name: ff_matched
    label: ff_xm1
    hidden_dim: 65
    latent_dim: 64
    n_steps: 8
    explore_noise_dim: 24
    explore_noise_std: 1.0
    explore_k: 1
  - name: ff_matched
    label: ff_xm8                 # exploration WITHOUT a loop — the XM-replaces-refinement test
    hidden_dim: 65
    latent_dim: 64
    n_steps: 8
    explore_noise_dim: 24
    explore_noise_std: 1.0
    explore_k: 8
  - name: trm
    label: trm_flat_det           # flat loop = the §4 comparison control (budget reference)
    hidden_dim: 64
    latent_dim: 64
    n_steps: 8
    use_rmsnorm: true
    deep_supervision: true
    explore_noise_dim: 24
    explore_noise_std: 0.0
  - name: trm
    label: trm_flat_xm8
    hidden_dim: 64
    latent_dim: 64
    n_steps: 8
    use_rmsnorm: true
    deep_supervision: true
    explore_noise_dim: 24
    explore_noise_std: 1.0
    explore_k: 8

deltas:
  - [trm_mixer_xm8, trm_mixer_xm1]    # exploration on the default recurrent arm (single knob)
  - [ff_xm8, ff_xm1]                  # exploration on the non-recurrent control (THE crux)
  - [trm_flat_xm8, trm_flat_det]      # exploration on the flat loop
  - [trm_mixer_xm1, trm_mixer_det]    # does a latent alone (no exploration) move anything?
  - [ff_xm8, trm_mixer_det]           # can exploration substitute for the refinement loop?
  - [trm_mixer_xm8, ff_xm8]           # mixer vs MLP, both exploring
  - [trm_mixer_det, ff_det]           # the M24 mixer-win anchor on this task

budget_reference: trm_flat_det
budget_tol: 0.05

train:
  epochs: 200
  lr: 1e-3
  weight_decay: 1e-4
  batch_size: 256
  device: cpu

explore_eval_samples: 8
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
parallel_workers: 4
results_dir: results
