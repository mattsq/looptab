# M34 — forecasting-breadth: M31/M32 decomposition on `traffic` (M=862 sensor-occupancy variables,
# hourly, 17544 steps) -- the widest channel count in the suite by a wide margin. Widths from
# scratchpad/m34/probe_budget.py (all within +-1.4% of trm_flat's budget). Pairs with `electricity`
# (M=321) to build the channel-count dose-response curve for M32's channel-independence-share
# finding (CLAUDE.md §11.2 #14). trm_flat's budget (~8.0M params) stays modest despite the huge
# M*lookback input (82752). electricity (M=321, smaller) took ~2hr/seed at epochs=25 in smoke
# testing — traffic is wider still (hidden up to 1760 vs 1110), so REDUCED to epochs=15 and 4
# seeds up front (same reasoning as m34_electricity_h24.yaml) rather than re-discovering the same
# cost the hard way. Below the §5.2 five-seed floor — EXPLORATORY/INDICATIVE, not a §5.2-compliant
# claim. Exact-shape profiling found the queued batch=128 cannot fit even under fp16; batch=64 also
# OOMs, while microbatch=16 sustains ~51 samples/s at ~4.1GiB.  Gradient accumulation preserves the
# effective optimizer batch=128.  The auto loader keeps the ~2.7GiB dataset host-side; otherwise
# even the microbatched model would lose its activation headroom.
#
# POST-REVIEW CORRECTION: same caveat as m34_electricity_h24.yaml -- the executed run confounds
# channel count with training recipe and chronological-block selection (seeds 0-3 = the first four
# of ten blocks), so it does not isolate channel count as a clean dose-response variable. See
# results/log/m34.md's correction block for the properly scoped claim.

task:
  name: traffic
  objective: regression
  params:
    dataset: traffic
    lookback: 96
    horizon: 24
    n_folds: 10
    test_frac: 0.3
  n_train: 6000
  n_test: 1000
  task_seed: 0

arms:
  - name: trm_mixer
    label: trm_mixer            # cross-VARIABLE mixing loop (budget-matched to trm_flat)
    hidden_dim: 1760
    latent_dim: 1760
    token_hidden: 8
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
    microbatch_size: 16
  - name: trm_mixer_nomix
    label: trm_mixer_nomix      # SHARED readout, token-mixing REMOVED (channel-independent)
    hidden_dim: 1760
    latent_dim: 1760
    token_hidden: 8
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
    microbatch_size: 16
  - name: trm_mixer_unsharedro
    label: trm_mixer_unsharedro  # mix ON, UNSHARED per-cell readout (readout isolation, CD body)
    hidden_dim: 350
    latent_dim: 350
    token_hidden: 8
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
    microbatch_size: 64
  - name: trm_mixer_nomix_unsharedro
    label: trm_mixer_nomix_unsharedro  # mix OFF, UNSHARED readout (readout isolation, CI body)
    hidden_dim: 360
    latent_dim: 360
    token_hidden: 8
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
    microbatch_size: 64
  - name: trm_mixer_nomix_distinctw
    label: trm_mixer_nomix_distinctw   # mix OFF, per-cell DISTINCT channel weights (weight-share)
    hidden_dim: 44
    latent_dim: 44
    token_hidden: 8
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm
    label: trm_flat              # flat loop (channel-dependent, UNSHARED M*H readout) — budget ref
    hidden_dim: 64
    latent_dim: 64
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: ff_matched
    label: ff_matched            # §4a param-matched shallow joint MLP (UNSHARED M*H readout) — anchor
    hidden_dim: 64
    latent_dim: 64
    n_steps: 8

deltas:
  - [trm_mixer_nomix, trm_mixer_nomix_unsharedro]
  - [trm_mixer, trm_mixer_unsharedro]
  - [trm_mixer, trm_mixer_nomix]
  - [trm_mixer_unsharedro, trm_mixer_nomix_unsharedro]
  - [trm_mixer_nomix, trm_mixer_nomix_distinctw]
  - [trm_mixer_nomix, ff_matched]
  - [trm_mixer_nomix_unsharedro, ff_matched]
  - [trm_mixer, ff_matched]
  - [trm_flat, ff_matched]

budget_reference: trm_flat
budget_tol: 0.05

train:
  epochs: 15
  lr: 1e-3
  weight_decay: 1e-4
  batch_size: 128
  device: cuda
  amp: true

seeds: [0, 1, 2, 3]
parallel_workers: 1
results_dir: results
