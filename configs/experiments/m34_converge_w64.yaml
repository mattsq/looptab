# M34 — synthetic scale-up (direction A): push `converge` past M9/M33's widest tested point
# (w=48) to w=64, now that `amp` makes Sudoku/converge-shaped (large-GEMM, compute-bound — NOT
# launch-bound, so cuda_graph would be a ~1.00x no-op per §11.2 #16) configs ~1.18x cheaper.
# `compile` is NOT used here — it needs the separate torch-2.13+triton-windows fast lane (§11.3),
# not the pinned torch 2.2.2 this repo's committed results use; Dynamo doesn't support Python 3.12
# on 2.2.2. Same 7-arm M33 decomposition recipe; widths from scratchpad/m34/probe_budget_synth.py. Open
# question (CLAUDE.md §11.2 #15/M33): does the mixing edge (Δ(trm_mixer−trm_mixer_nomix)) and the
# leg-1/P1 legs keep GROWING with width past w=48, or plateau? M9/M11 found the analogous coherence
# edge grows with size on the flat loop; M33 established mixing is ~the whole win at w<=48.
#
# POST-REVIEW CORRECTION: "width" here is `w`, a TASK parameter (ring length/cell count), and
# every arm is re-widened to stay budget-matched at each w -- so this is a task-size sweep with a
# matched model, NOT the model-capacity-at-fixed-task sweep M9/M11 ran. The M9/M11 comparison
# above was the original (mistaken) framing; see results/log/m34.md's correction block for the
# properly scoped result (per-cell Δ stays ~flat across w=24->96, which is not a capacity claim).

task:
  name: converge
  params:
    rule: 78
    distractors: 0
    w: 64
  n_train: 4000
  n_test: 1000
  task_seed: 42
  train_sample_seed: 1
  test_sample_seed: 2

arms:
  - name: trm_mixer
    label: trm_mixer
    hidden_dim: 90
    latent_dim: 90
    token_hidden: 48
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm_mixer_nomix
    label: trm_mixer_nomix
    hidden_dim: 104
    latent_dim: 104
    token_hidden: 48
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm_mixer_unsharedro
    label: trm_mixer_unsharedro
    hidden_dim: 68
    latent_dim: 68
    token_hidden: 48
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm_mixer_nomix_unsharedro
    label: trm_mixer_nomix_unsharedro
    hidden_dim: 80
    latent_dim: 80
    token_hidden: 48
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm_mixer_nomix_distinctw
    label: trm_mixer_nomix_distinctw
    hidden_dim: 14
    latent_dim: 14
    token_hidden: 48
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm
    label: trm_flat
    hidden_dim: 64
    latent_dim: 64
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: ff_matched
    label: ff_matched
    hidden_dim: 64
    latent_dim: 64
    n_steps: 8

deltas:
  - [trm_mixer, trm_mixer_nomix]
  - [trm_mixer_nomix, ff_matched]
  - [trm_mixer_nomix, trm_mixer_nomix_unsharedro]
  - [trm_mixer, trm_mixer_unsharedro]
  - [trm_mixer_unsharedro, trm_mixer_nomix_unsharedro]
  - [trm_mixer_nomix, trm_mixer_nomix_distinctw]
  - [trm_mixer_nomix_unsharedro, ff_matched]
  - [trm_mixer, ff_matched]
  - [trm_flat, ff_matched]

train:
  epochs: 100
  lr: 1e-3
  weight_decay: 1e-4
  batch_size: 256
  device: cuda
  amp: true

budget_reference: trm_flat
budget_tol: 0.05

seeds: [0, 1, 2, 3, 4, 5, 6, 7]
parallel_workers: 1
results_dir: results
