# M34 — forecasting-breadth: M31/M32 decomposition on `electricity` (M=321 client-load variables,
# hourly, 26304 steps) -- the first far-outside-{7,21} channel count tested. Widths from
# scratchpad/m34/probe_budget.py (all within +-1.4% of trm_flat's budget). Together with `traffic`
# (M=862) this turns M32's two-point channel-independence-share observation (76-84% weather M=21
# vs 9-44% etth1 M=7) into a proper dose-response curve against channel count (CLAUDE.md §11.2
# #14's listed open item). Param counts stay modest (trm_flat ~3.0M) despite the huge M*lookback
# input (30816) -- no VRAM risk (peak ~7.7GB/8GB observed), but a single-seed smoke test at
# epochs=25 ran ~2hr and was still going (genuinely compute-bound at this width x steps x input
# size, not launch-bound the way ETTh1-scale configs are -- cuda_graph gives little/no help here,
# same as the Sudoku-scale precedent in §11.2 #16). A full 10-seed/25-epoch sweep would be
# ~20hr+, too big a commitment for a first exploratory pass. REDUCED to epochs=15 and 4 seeds —
# below the §5.2 five-seed variance floor, so treat this run as EXPLORATORY/INDICATIVE (a
# directional read on whether the channel-count pattern holds), not a §5.2-compliant claim.
# Exact-shape profiling on this RTX 2070 overturned the earlier "harmless at worst" assumption:
# fp32 cuda_graph's private pool oversubscribes 8GB (18.5s/step), eager fp32 is 6.34s, while fp16
# microbatch=64 is ~0.52s per EFFECTIVE batch=128 (~12x vs eager, ~36x vs the queued graph path).
# `microbatch_size` is gradient accumulation, so the optimizer batch remains 128.  The loader also
# keeps this ~1.0GiB dataset host-side automatically, preserving activation headroom.
#
# POST-REVIEW CORRECTION: the executed run does NOT isolate channel count as a clean dose-response
# variable -- it also differs from the M=7/21 configs in training recipe (epochs 15 vs 25, AMP+
# microbatch vs full-fp32/cuda_graph) and in which chronological blocks were sampled (seeds 0-3 =
# the FIRST four of ten backtest blocks, not a random sample -- see fold = seed % n_folds in
# real.py). Results are real and reported, but read as "these four early blocks under this
# recipe," not as an isolated channel-count effect. See results/log/m34.md's correction block.

task:
  name: electricity
  objective: regression
  params:
    dataset: electricity
    lookback: 96
    horizon: 24
    n_folds: 10
    test_frac: 0.3
  n_train: 6000
  n_test: 1000
  task_seed: 0

arms:
  - name: trm_mixer
    label: trm_mixer            # cross-VARIABLE mixing loop (budget-matched to trm_flat)
    hidden_dim: 1110
    latent_dim: 1110
    token_hidden: 8
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
    microbatch_size: 64
  - name: trm_mixer_nomix
    label: trm_mixer_nomix      # SHARED readout, token-mixing REMOVED (channel-independent)
    hidden_dim: 1110
    latent_dim: 1110
    token_hidden: 8
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
    microbatch_size: 64
  - name: trm_mixer_unsharedro
    label: trm_mixer_unsharedro  # mix ON, UNSHARED per-cell readout (readout isolation, CD body)
    hidden_dim: 340
    latent_dim: 340
    token_hidden: 8
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm_mixer_nomix_unsharedro
    label: trm_mixer_nomix_unsharedro  # mix OFF, UNSHARED readout (readout isolation, CI body)
    hidden_dim: 340
    latent_dim: 340
    token_hidden: 8
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm_mixer_nomix_distinctw
    label: trm_mixer_nomix_distinctw   # mix OFF, per-cell DISTINCT channel weights (weight-share)
    hidden_dim: 44
    latent_dim: 44
    token_hidden: 8
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: trm
    label: trm_flat              # flat loop (channel-dependent, UNSHARED M*H readout) — budget ref
    hidden_dim: 64
    latent_dim: 64
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
  - name: ff_matched
    label: ff_matched            # §4a param-matched shallow joint MLP (UNSHARED M*H readout) — anchor
    hidden_dim: 64
    latent_dim: 64
    n_steps: 8

deltas:
  - [trm_mixer_nomix, trm_mixer_nomix_unsharedro]
  - [trm_mixer, trm_mixer_unsharedro]
  - [trm_mixer, trm_mixer_nomix]
  - [trm_mixer_unsharedro, trm_mixer_nomix_unsharedro]
  - [trm_mixer_nomix, trm_mixer_nomix_distinctw]
  - [trm_mixer_nomix, ff_matched]
  - [trm_mixer_nomix_unsharedro, ff_matched]
  - [trm_mixer, ff_matched]
  - [trm_flat, ff_matched]

budget_reference: trm_flat
budget_tol: 0.05

train:
  epochs: 15
  lr: 1e-3
  weight_decay: 1e-4
  batch_size: 128
  device: cuda
  speed: auto
  amp: true

seeds: [0, 1, 2, 3]
parallel_workers: 1
results_dir: scratchpad/m35/results
