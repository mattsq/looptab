# Follow-up to the speed:auto rerun (fixed bounded probe): total wall clock (64m30s) barely
# improved over the buggy version (78m42s) even though the probe itself is now ~14x cheaper per
# candidate. This isolates whether the SUSTAINED full-epoch cost of cuda_graph-inclusive modes at
# electricity's h340 arms diverges from what an 8-batch probe predicts -- one arm, one seed, real
# 15-epoch training, each mode timed for real (not probed).
task:
  name: electricity
  objective: regression
  params: {dataset: electricity, lookback: 96, horizon: 24, n_folds: 10, test_frac: 0.3}
  n_train: 6000
  n_test: 1000
  task_seed: 0
arms:
  - name: trm_mixer_unsharedro
    label: trm_mixer_unsharedro
    hidden_dim: 340
    latent_dim: 340
    token_hidden: 8
    n_steps: 8
    n_latent: 1
    use_rmsnorm: true
    deep_supervision: true
deltas: []
train:
  epochs: 15
  lr: 1e-3
  weight_decay: 1e-4
  batch_size: 128
  device: cuda
  cuda_graph: true
seeds: [0]
results_dir: scratchpad/m35/results
