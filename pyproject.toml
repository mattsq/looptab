[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "looptab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Pinned to torch 2.2.x and numpy 1.x to support macOS x86_64 wheel compatibility on Intel CPUs
    "torch>=2.2,<2.3",
    "numpy>=1.26,<2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
plot = ["matplotlib"]
# Accelerator selection (see https://docs.astral.sh/uv/guides/integration/pytorch/).
# Plain `uv sync` is unchanged (PyPI torch: CPU on Windows/Linux, universal cpu/mps on macOS) —
# the canonical suite is tiny-first and network-free, so CPU stays the default everywhere.
# On a machine with a CUDA GPU (e.g. for the heavier 3-D-matmul trm_mixer/trm_decoupled
# configs), `uv sync --extra gpu` swaps in a CUDA build instead. `--extra cpu` pins the
# CPU build explicitly. The two are mutually exclusive (see [tool.uv.conflicts] below).
cpu = ["torch>=2.2,<2.3"]
gpu = ["torch>=2.2,<2.3"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu121", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
